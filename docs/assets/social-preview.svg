    <text x="0" y="230" fill="#a9b6ba" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21">Borrow a teammate's local Codex.</text>
    <text x="0" y="263" fill="#a9b6ba" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21">Credentials stay on their machine.</text>
