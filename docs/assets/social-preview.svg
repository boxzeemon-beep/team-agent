<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Team Agent — the multiplayer lobby for coding agents</title>
  <desc id="desc">A modern tactical collaboration lobby with four agent squad slots and a task pipeline ending in diff, tests, and commit.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071018"/><stop offset="0.54" stop-color="#0c1821"/><stop offset="1" stop-color="#18242c"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#182630" stop-opacity="0.96"/><stop offset="1" stop-color="#0d171e" stop-opacity="0.96"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e4ad55"/><stop offset="1" stop-color="#f2d395"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#6f8791" stroke-opacity="0.08"/></pattern>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#00070b" flood-opacity="0.42"/></filter>
    <filter id="cyan-glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="lobby-clip"><path d="M632 80H1198L1228 110V560H632Z"/></clipPath>
  </defs>
  <rect width="1280" height="640" fill="url(#background)"/><rect width="1280" height="640" fill="url(#grid)"/>
