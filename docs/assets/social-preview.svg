    <path d="M0 0H76" stroke="url(#gold)" stroke-width="4"/>
    <text x="0" y="68" fill="#f4f1e9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="48" font-weight="760" letter-spacing="-1.2">The multiplayer lobby</text>
