name: Share a workflow
description: Show how your team uses shared coding agents so others can reproduce it.
title: "[Workflow]: "
body:
  - type: markdown
    attributes:
      value: |
        Share a concrete, sanitized Team Agent workflow. This issue is public; remove private source code, repository names, credentials, tokens, customer data, and personal details.
  - type: textarea
    id: problem
    attributes:
      label: Team problem
      description: Who needed help, and what task was difficult before Team Agent?
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Setup
      description: Describe team size, number of Agent owners, deployment method, and test command without identifying private systems.
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: Example task
      description: Provide a sanitized prompt or a short description of the work performed.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Result
      description: What changed? Include measurable time saved or coordination removed only when you have observed it.
    validations:
      required: true
  - type: textarea
    id: lessons
    attributes:
      label: What others should know
      description: Share setup friction, limitations, and what you would do differently.
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: Publication
      options:
        - label: The information above is sanitized and may be linked from Team Agent documentation.
          required: true
